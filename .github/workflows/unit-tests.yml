name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:

env:
  CGO_ENABLED: '0'

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.26.3"
          check-latest: true
      - name: Run unit tests
        shell: bash
        run: scripts/tests.unit.sh

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
