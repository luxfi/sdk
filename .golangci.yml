version: "2"

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
  settings:
    errcheck:
      check-blank: false
    staticcheck:
      checks:
        - "all"
        - "-SA1019"   # Ignore deprecated API warnings
        - "-ST1000"   # Package comment format
        - "-ST1003"   # ALL_CAPS naming
        - "-ST1016"   # Receiver name consistency
        - "-ST1019"   # Duplicate imports
        - "-ST1020"   # Exported function comment format

run:
  timeout: 10m
  exclude-dirs:
    - .archive
    - examples

issues:
  exclude-generated: lax
  exclude-files:
    - ".*_test\\.go$"
