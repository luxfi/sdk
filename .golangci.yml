version: "2"

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
  exclusions:
    generated: lax
    paths:
      - .archive
      - examples
  settings:
    staticcheck:
      checks:
        - "all"
        - "-SA1019"   # Ignore deprecated API warnings
        - "-ST*"      # Ignore all style checks
        - "-QF*"      # Ignore quick fix suggestions

run:
  timeout: 10m
