version: "2"

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
  settings:
    errcheck:
      check-blank: false
      exclude-functions:
        - (*github.com/luxfi/crypto/secp256k1.SecpKeychain).Add
    staticcheck:
      checks:
        - "all"
        - "-SA1019"   # Ignore deprecated API warnings
        - "-ST1000"   # Package comment format
        - "-ST1003"   # ALL_CAPS naming
        - "-ST1019"   # Duplicate imports

run:
  timeout: 10m
  exclude-dirs:
    - .archive
    - examples

issues:
  exclude-generated: lax
