version: "2"

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
  exclusions:
    generated: lax
    paths:
      - .archive
      - examples
  settings:
    staticcheck:
      checks:
        - "all"

run:
  timeout: 10m
