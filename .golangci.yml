version: "2"

linters:
  default: none
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - ineffassign
  settings:
    gofmt:
      simplify: true
    errcheck:
      check-blank: false
      exclude-functions:
        - (*github.com/luxfi/crypto/secp256k1.SecpKeychain).Add
    staticcheck:
      checks:
        - "all"
        - "-SA1019"  # Ignore deprecated API warnings

run:
  timeout: 10m
  exclude-dirs:
    - .archive
    - examples

issues:
  exclude-generated: lax
