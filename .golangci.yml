version: "2"

linters:
  default: none
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - ineffassign
  settings:
    gofmt:
      simplify: true
    errcheck:
      check-blank: false

run:
  timeout: 10m
  exclude-dirs:
    - .archive
    - examples

issues:
  exclude-generated: lax
